name: KernelSU Build for Redmi Note 12 Pro Plus

on:
  push:
    branches:
      - "12.1"  # Change if needed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison clang lld libssl-dev libelf-dev libncurses-dev

      - name: Clone KernelSU
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU KernelSU
          ls -la KernelSU  # Debug: Check KernelSU contents

      - name: Merge KernelSU into Kernel Tree
        run: |
          cp -r KernelSU/include/* include/ || true
          cp -r KernelSU/drivers/* drivers/ || true
          echo "KernelSU merged successfully!"

      - name: Clone Proton Clang Toolchain
        run: |
          mkdir -p toolchains && cd toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang proton-clang
          cd ..

      - name: Set Environment Variables
        run: |
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
          echo "KERNEL_OUT=$(pwd)/out" >> $GITHUB_ENV
          echo "TOOLCHAIN_DIR=$(pwd)/toolchains/proton-clang" >> $GITHUB_ENV

      - name: Debug Toolchain Path
        run: |
          echo "Toolchain path: $TOOLCHAIN_DIR"
          ls -la $TOOLCHAIN_DIR

      - name: Debug Missing Files
        run: |
          ls -la drivers/input/touchscreen/

      - name: Clean Build Directory (Without mrproper)
        run: |
          make O=$KERNEL_OUT clean || true

      - name: Compile Kernel with KernelSU
        run: |
          export PATH=$TOOLCHAIN_DIR/bin:$PATH
          mkdir -p $KERNEL_OUT
          make O=$KERNEL_OUT ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 ruby_defconfig
          make O=$KERNEL_OUT ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 -j$(nproc)

      - name: Upload Compiled Kernel
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Built
          path: ${{ env.KERNEL_OUT }}/arch/arm64/boot/Image.gz-dtb
