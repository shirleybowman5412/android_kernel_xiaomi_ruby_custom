name: KernelSU Build for Redmi Note 12 Pro Plus

on:
  push:
    branches:
      - "12.1"  # Change if needed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Clone KernelSU
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU KernelSU
          ls -la KernelSU  # Debug: Check KernelSU contents

      - name: Merge KernelSU into Kernel Tree
        run: |
          cp -r KernelSU/include/* include/ || true
          cp -r KernelSU/drivers/* drivers/ || true
          echo "KernelSU merged successfully!"

      - name: Install Dependencies (DTC, Clang, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler bc bison flex libssl-dev \
                                  git wget cpio unzip curl build-essential \
                                  python3 python3-pip python3-venv ccache

      - name: Setup Google Clang Toolchain (Latest AOSP Version)
        run: |
          mkdir -p toolchains && cd toolchains
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          cd ..

      - name: Set Environment Variables
        run: |
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
          echo "KERNEL_OUT=$(pwd)/out" >> $GITHUB_ENV
          echo "TOOLCHAIN_DIR=$(pwd)/toolchains/clang" >> $GITHUB_ENV

      - name: Update Submodules (if any)
        run: |
          git submodule update --init --recursive

      - name: Prepare Kernel Build
        run: |
          export PATH=$TOOLCHAIN_DIR/bin:$PATH
          mkdir -p $KERNEL_OUT
          make mrproper
          touch scripts/dtc/drvgen  # Fix missing drvgen issue
          dtc --version  # Verify Device Tree Compiler installation

      - name: Disable Touchscreen Driver (Optional, if not needed)
        run: |
          sed -i '/nt36572_common/d' drivers/input/touchscreen/Makefile  # Remove driver if not required

      - name: Compile Kernel with KernelSU
        run: |
          make O=$KERNEL_OUT ARCH=arm64 LLVM=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              ruby_defconfig
          make O=$KERNEL_OUT ARCH=arm64 LLVM=1 -j$(nproc) Image.gz-dtb

      - name: Create boot.img
        run: |
          mkdir -p boot
          wget -qO mkbootimg.py https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/mkbootimg.py?format=TEXT
          chmod +x mkbootimg.py
          python3 mkbootimg.py \
            --kernel $KERNEL_OUT/arch/arm64/boot/Image.gz-dtb \
            --ramdisk /dev/null \
            --cmdline "console=ttyMSM0,115200n8 earlycon=msm_serial_dm,0xC170000" \
            --base 0x80000000 \
            --pagesize 4096 \
            --output boot/boot.img
          echo "boot.img successfully created!"

      - name: Create TWRP Flashable ZIP
        run: |
          mkdir -p twrp_zip
          cp boot/boot.img twrp_zip/
          cat > twrp_zip/updater-script <<EOF
          assert(getprop("ro.product.device") == "ruby");
          ui_print("Flashing Kernel...");
          package_extract_file("boot.img", "/dev/block/bootdevice/by-name/boot");
          EOF
          cd twrp_zip && zip -r ../KernelSU-Flashable.zip . && cd ..
          echo "TWRP flashable zip created!"

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: Boot-Image
          path: boot/boot.img

      - name: Upload TWRP Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-TWRP-Flashable
          path: KernelSU-Flashable.zip

      - name: Upload Compiled Kernel
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Built
          path: ${{ env.KERNEL_OUT }}/arch/arm64/boot/Image.gz-dtb

      - name: Upload All Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: All-Build-Artifacts
          path: $KERNEL_OUT/**
