name: KernelSU Build for Redmi Note 12 Pro Plus

on:
  push:
    branches:
      - "12.1"  # Change if needed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Clone KernelSU
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU KernelSU
          ls -la KernelSU  # Debug: Check KernelSU contents

      - name: Merge KernelSU into Kernel Tree
        run: |
          cp -r KernelSU/include/* include/ || true
          cp -r KernelSU/drivers/* drivers/ || true
          echo "KernelSU merged successfully!"

      - name: Setup Proton Clang Toolchain (Fixed Link)
        run: |
          mkdir -p toolchains && cd toolchains
          wget https://github.com/kdrag0n/proton-clang/releases/download/20221210/proton-clang.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          cd ..

      - name: Set Environment Variables
        run: |
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
          echo "KERNEL_OUT=$(pwd)/out" >> $GITHUB_ENV
          echo "TOOLCHAIN_DIR=$(pwd)/toolchains/proton-clang" >> $GITHUB_ENV
          echo "PATH=$TOOLCHAIN_DIR/bin:$PATH" >> $GITHUB_ENV

      - name: Check & Fix Missing Touchscreen Driver
        run: |
          if [ ! -d "drivers/input/touchscreen/nt36572_common" ]; then
            echo "Missing nt36572_common driver. Attempting to clone..."
            git clone https://github.com/xiaomi-touchscreen-drivers/nt36572_common.git drivers/input/touchscreen/nt36572_common || true
          fi
          ls -la drivers/input/touchscreen/

      - name: Compile Kernel with KernelSU
        run: |
          mkdir -p $KERNEL_OUT
          make O=$KERNEL_OUT ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 ruby_defconfig
          make O=$KERNEL_OUT ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 -j$(nproc)

      - name: Upload Compiled Kernel
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Built
          path: ${{ env.KERNEL_OUT }}/arch/arm64/boot/Image.gz-dtb
